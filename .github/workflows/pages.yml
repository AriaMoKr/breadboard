# Publishes the site to GitHub Pages on every push to main, or when run by hand from the Actions
# tab, through the sites' shared workflow (AriaMoKr/common, .github/workflows/pages.yml, on Node
# 24): the unit tests, then `npm run build` (which typechecks first), then dist/ is deployed. To
# take a new version of it, move the tag after @, as common's in package.json.
# Once per repository, set Settings > Pages > Build and deployment > Source to "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits for the one in progress instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: AriaMoKr/common/.github/workflows/pages.yml@v0.5.0
    with:
      build: npm run build
      path: dist
