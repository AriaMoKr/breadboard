<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Breadboard builds, part for part, in your browser: Ben Eater’s 8-bit computer, Don Lancaster’s TV Typewriter and Moritz Klein’s synth, with a lab for each stage." />
    <title>Breadboard Workshop</title>
    <!-- link previews (Open Graph, X/Twitter): absolute URLs, the GitHub Pages copy; the picture is
         public/social-preview.jpg (npm run preview-image). tests/link-preview.test.ts keeps them in step. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Breadboard Workshop" />
    <meta property="og:title" content="Breadboard Workshop" />
    <meta property="og:description" content="Breadboard builds, part for part, in your browser: Ben Eater’s 8-bit computer, Don Lancaster’s TV Typewriter and Moritz Klein’s synth, with a lab for each stage." />
    <meta property="og:url" content="https://ariamokr.github.io/breadboard/" />
    <meta property="og:image" content="https://ariamokr.github.io/breadboard/social-preview.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Breadboard Workshop over its three builds: Ben Eater’s 8-bit computer on breadboards, its decimal display showing 42; Don Lancaster’s TV Typewriter, its TV showing the text in its memory; and Moritz Klein’s synth, an oscillator’s schematic over its sawtooths on a scope" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23ff3b3b'/%3E%3C/svg%3E" />
    <!-- installable app: manifest + icons (public/), service worker written by scripts/sw-dist.mjs -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111318" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef0f4" />
  </head>
  <body>
    <div id="app"></div>
    <!-- a plain link (Vite leaves <a> alone) also lets a wget mirror find the VR page -->
    <noscript><p>This simulator needs JavaScript. There is also a <a href="vr.html">VR view</a> (it needs JavaScript too).</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
