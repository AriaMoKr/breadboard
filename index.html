<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive simulator that follows Ben Eater's 'Building an 8-bit breadboard computer!' playlist, video by video." />
    <title>Breadboard 8-bit</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23ff3b3b'/%3E%3C/svg%3E" />
    <!-- installable app: manifest + icons (public/), service worker written by scripts/sw-dist.mjs -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111318" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef0f4" />
  </head>
  <body>
    <div id="app"></div>
    <!-- a plain link (Vite leaves <a> alone) also lets a wget mirror find the VR page -->
    <noscript><p>This simulator needs JavaScript. There is also a <a href="vr.html">VR view</a> (it needs JavaScript too).</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
